name: Build

'on':
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BEPINEX_VERSION: 5.4.2333

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Valheim toolchain
        id: toolchain
        uses: ./.github/actions/valheim-toolchain
        with:
          bepinex-version: ${{ env.BEPINEX_VERSION }}

      - name: Assert version consistency
        shell: bash
        run: tools/ci/assert-version.sh

      - name: Build ValheimOne
        shell: bash
        run: |
          set -euo pipefail
          ./build.sh
          test -f src/ValheimOne/bin/Release/net472/ValheimOne.dll

      - name: Leak gate
        shell: bash
        run: |
          tools/ci/leak-gate.sh \
            src/ValheimOne/bin/Release/net472/ValheimOne.dll \
            tools/release/valheimone.cfg

      - name: Upload ValheimOne DLL
        uses: actions/upload-artifact@v4
        with:
          name: ValheimOne-${{ steps.toolchain.outputs.cache-version }}
          path: |
            src/ValheimOne/bin/Release/net472/ValheimOne.dll
            tools/golden-fingerprint.txt
          if-no-files-found: error

      - name: Write build summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          version_file="src/ValheimOne/Networking/VersionInfo.cs"
          plugin_version="unavailable"
          if [[ -f "${version_file}" ]]; then
            detected_version="$(
              grep -E 'public const string PluginVersion = "[^"]+";' "${version_file}" \
                | head -n 1 \
                | sed -E 's/.*PluginVersion = "([^"]+)";.*/\1/' \
                || true
            )"
            if [[ -n "${detected_version}" ]]; then
              plugin_version="${detected_version}"
            fi
          fi

          {
            echo "## ValheimOne build"
            echo
            echo "- Valheim dedicated-server build ID: ${{ steps.toolchain.outputs.buildid || 'unavailable' }}"
            echo "- ValheimOne plugin version: ${plugin_version}"
          } >> "${GITHUB_STEP_SUMMARY}"

name: Build

'on':
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BEPINEX_VERSION: 5.4.2351

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Valheim toolchain
        id: toolchain
        uses: ./.github/actions/valheim-toolchain
        with:
          bepinex-version: ${{ env.BEPINEX_VERSION }}
          testserver: 'true'

      - name: Assert version consistency
        shell: bash
        run: tools/ci/assert-version.sh

      - name: Fog world-coordinate regression
        run: node tools/ci/test-fog-geometry.cjs

      - name: Build ValheimOne
        shell: bash
        run: |
          set -euo pipefail
          ./build.sh
          test -f src/ValheimOne/bin/Release/net472/ValheimOne.dll

      - name: Leak gate
        shell: bash
        run: |
          tools/ci/leak-gate.sh \
            src/ValheimOne/bin/Release/net472/ValheimOne.dll \
            tools/release/valheimone.cfg

      # The same behaviour check the Release workflow runs (about 35 seconds): boots the dedicated
      # server on the pinned SmokeWorld and compares the worldgen fingerprint, the patched methods
      # and the registered modules with tools/golden-fingerprint.txt. After a Valheim update it
      # fails until the drift is reviewed and re-blessed locally, as the Release run does.
      - name: Contract test
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/contract.log"
          set +e
          tools/contract-test.sh 2>&1 | tee "${log}"
          status=${PIPESTATUS[0]}
          set -e
          if (( status != 0 )); then
            echo "::error::contract test exited ${status}"
            exit "${status}"
          fi
          grep -q '^CONTRACT PASS$' "${log}" || {
            echo "::error::contract test did not print CONTRACT PASS"
            exit 1
          }

      - name: Upload ValheimOne DLL
        uses: actions/upload-artifact@v4
        with:
          name: ValheimOne-${{ steps.toolchain.outputs.cache-version }}
          path: |
            src/ValheimOne/bin/Release/net472/ValheimOne.dll
            tools/golden-fingerprint.txt
          if-no-files-found: error

      - name: Write build summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          version_file="src/ValheimOne/Networking/VersionInfo.cs"
          plugin_version="unavailable"
          if [[ -f "${version_file}" ]]; then
            detected_version="$(
              grep -E 'public const string PluginVersion = "[^"]+";' "${version_file}" \
                | head -n 1 \
                | sed -E 's/.*PluginVersion = "([^"]+)";.*/\1/' \
                || true
            )"
            if [[ -n "${detected_version}" ]]; then
              plugin_version="${detected_version}"
            fi
          fi

          {
            echo "## ValheimOne build"
            echo
            echo "- Valheim dedicated-server build ID: ${{ steps.toolchain.outputs.buildid || 'unavailable' }}"
            echo "- ValheimOne plugin version: ${plugin_version}"
          } >> "${GITHUB_STEP_SUMMARY}"

[LiveMap]

## Enable the Live map feature. All ValheimOne gameplay features are disabled by default.
# Setting type: Boolean
# Default value: false
Enabled = false

## TCP port for the live-map HTTP server.
# Setting type: Int32
# Default value: 8790
Port = 8790

## World-map texture size. Power-of-two values of 2048 or 4096 are recommended.
# Setting type: Int32
# Default value: 2048
TextureSize = 2048

## Seconds between server-side player snapshot updates.
# Setting type: Single
# Default value: 2
PlayerUpdateSeconds = 2

## Days to retain last-seen player positions and playtime, clamped to 1..365.
# Setting type: Int32
# Default value: 14
GhostRetentionDays = 14

## Retained for compatibility; the token-authenticated admin view always shows all players.
# Setting type: Boolean
# Default value: false
AdminSeesAll = false

## IP address to bind. Empty listens on all interfaces with a localhost fallback.
# Setting type: String
# Default value: 
BindIp = 

## Optional token granting the admin map view as ?token= or X-LiveMap-Token.
# Setting type: String
# Default value: 
AccessToken = 

## Optional token granting a shared spectator map view as ?token= or X-LiveMap-Token: player names, all layers, and follow, but never console or admin actions.
# Setting type: String
# Default value: 
ShareToken = 

## Serve a read-only public map view to tokenless requests.
# Setting type: Boolean
# Default value: true
PublicView = true

## Expose player-placed cartography pins on the public map without author names.
# Setting type: Boolean
# Default value: false
PublicPins = false

## Shared-view visitors may add web pins and edit/delete their own; admins always edit everything.
# Setting type: Boolean
# Default value: true
SharedPinEditing = true

## Expose web pins read-only to the public view.
# Setting type: Boolean
# Default value: false
PublicWebPins = false

## Record periodic aggregate world-state snapshots (explored fog, base footprints, portals, boss progress, and aggregate movement) so the map can replay world history. Snapshots are state, not images, and are bounded on disk.
# Setting type: Boolean
# Default value: true
Timelapse = true

## Minutes between world timelapse snapshots, clamped to 5..1440.
# Setting type: Int32
# Default value: 60
TimelapseIntervalMinutes = 60

## Expose world timelapse history to the tokenless public view. Off by default: base-growth history maps where players live and how they expanded over time, which is more revealing than a live position dot, so opening it is an explicit owner decision.
# Setting type: Boolean
# Default value: false
PublicTimelapse = false

## Mirror player Say and Shout chat onto authenticated live-map views. Disabled by default because chat is player speech and the server owner must explicitly opt in.
# Setting type: Boolean
# Default value: false
MirrorChat = false

## Omit players who disabled in-game position sharing from shared and public views. The token-authenticated admin view always shows all players.
# Setting type: Boolean
# Default value: true
RespectInGameVisibility = true

## Show player names on the public view. Disabled by default so a public link never exposes player names; public players render as anonymous markers unless the owner opts in.
# Setting type: Boolean
# Default value: false
PublicShowPlayerNames = false

## Serve ships, carts, and portals as a toggleable admin map layer.
# Setting type: Boolean
# Default value: false
EntityLayer = false

## Serve request-gated ore and forage layers on shared and admin maps.
# Setting type: Boolean
# Default value: true
ResourceLayers = true

## Fog of war for the map view: off (full map), trails (areas players have traveled), explored (player trails plus cartography-table exploration data).
# Setting type: String
# Default value: off
FogMode = off

## Enable the web admin console API and dashboard console tab.
# Setting type: Boolean
# Default value: false
ConsoleEnabled = false

## Space-separated list of console commands the web console may execute. The ValheimOne vo command family is always allowed even when omitted.
# Setting type: String
# Default value: vo save kick ban unban banned lodbias sleep
ConsoleWhitelist = vo save kick ban unban banned lodbias sleep

## Allow the web console to execute any console command, bypassing ConsoleWhitelist.
# Setting type: Boolean
# Default value: false
AllowAllCommands = false

## Server log ring buffer size for the web console (clamped 50..5000).
# Setting type: Int32
# Default value: 500
ConsoleLogLines = 500

## Serve /api/status without an access token even when the map itself is token-locked (for hosting-panel queries).
# Setting type: Boolean
# Default value: true
StatusPublic = true

